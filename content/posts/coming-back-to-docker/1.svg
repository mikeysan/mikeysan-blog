<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" role="img" aria-label="A virtual machine stack beside a container stack. The VM stack includes a guest OS and kernel band; the container stack does not, making it one band shorter." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #1f2328;
    }
    .box { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.25; }
    .lbl { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 12.5px; fill: #6b7280; text-anchor: middle; }
    .head { font-size: 16px; font-weight: 650; text-anchor: middle; letter-spacing: 0.01em; }
    .cap { font-size: 13.5px; fill: #6b7280; text-anchor: middle; }
    .warm { fill: #fef3c7; stroke: #d97706; stroke-width: 1.75; }
    .warm-lbl { fill: #8a4f06; }
    .cool { fill: #ccfbf1; stroke: #0d9488; stroke-width: 1.75; }
    .cool-lbl { fill: #115e59; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .box { fill: #24282d; stroke: #3b424b; }
      .sub { fill: #9ca3af; }
      .cap { fill: #9ca3af; }
      .warm { fill: #3a2206; stroke: #d9820b; }
      .warm-lbl { fill: #fcd34d; }
      .cool { fill: #062f2c; stroke: #14b8a6; }
      .cool-lbl { fill: #5eead4; }
    }
  </style>

  <g class="d">
    <text class="head" x="230" y="44">Virtual machine</text>
    <text class="head" x="650" y="44">Container</text>

    <!-- left stack: virtual machine -->
    <g>
      <rect class="box" x="80" y="96" width="300" height="48" rx="5"/>
      <text class="lbl" x="230" y="126">Application</text>

      <rect class="box" x="80" y="152" width="300" height="48" rx="5"/>
      <text class="lbl" x="230" y="182">Libraries and runtime</text>

      <rect class="warm" x="80" y="208" width="300" height="48" rx="5"/>
      <text class="lbl warm-lbl" x="230" y="231">Guest OS and kernel</text>
      <text class="sub warm-lbl" x="230" y="248">one per virtual machine</text>

      <rect class="box" x="80" y="264" width="300" height="48" rx="5"/>
      <text class="lbl" x="230" y="294">Hypervisor</text>

      <rect class="box" x="80" y="320" width="300" height="48" rx="5"/>
      <text class="lbl" x="230" y="350">Host OS and kernel</text>

      <rect class="box" x="80" y="376" width="300" height="48" rx="5"/>
      <text class="lbl" x="230" y="406">Hardware</text>
    </g>

    <!-- right stack: container -->
    <g>
      <rect class="box" x="500" y="152" width="300" height="48" rx="5"/>
      <text class="lbl" x="650" y="182">Application</text>

      <rect class="box" x="500" y="208" width="300" height="48" rx="5"/>
      <text class="lbl" x="650" y="238">Libraries and runtime</text>

      <rect class="box" x="500" y="264" width="300" height="48" rx="5"/>
      <text class="lbl" x="650" y="294">Container runtime</text>

      <rect class="cool" x="500" y="320" width="300" height="48" rx="5"/>
      <text class="lbl cool-lbl" x="650" y="343">Host OS and kernel</text>
      <text class="sub cool-lbl" x="650" y="360">shared by every container</text>

      <rect class="box" x="500" y="376" width="300" height="48" rx="5"/>
      <text class="lbl" x="650" y="406">Hardware</text>
    </g>

    <text class="cap" x="440" y="462">One band shorter. That band is the kernel, and it is why a container starts in milliseconds.</text>
  </g>
</svg>
