<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="A tag points at one image today and can be repointed at a different image later. A digest always resolves to the same image." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .tip-warm { fill: #d9820b; }
      .tip-cool { fill: #14b8a6; }
    }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #1f2328;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      text-anchor: middle;
    }
    .head { font-size: 15.5px; font-weight: 650; text-anchor: middle; }
    .note { font-size: 12px; fill: #6b7280; text-anchor: middle; }
    .cap { font-size: 13.5px; fill: #6b7280; text-anchor: middle; }
    .blob { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.25; }
    .pill-warm { fill: #fef3c7; stroke: #d97706; stroke-width: 1.75; }
    .pill-cool { fill: #ccfbf1; stroke: #0d9488; stroke-width: 1.75; }
    .warm-t { fill: #8a4f06; }
    .cool-t { fill: #115e59; }
    .arrow-warm { stroke: #d97706; stroke-width: 2; fill: none; }
    .arrow-cool { stroke: #0d9488; stroke-width: 2; fill: none; }
    .divider { stroke: #d1d5db; stroke-width: 1; }
    .tip-warm { fill: #d97706; }
    .tip-cool { fill: #0d9488; }
    @media (prefers-color-scheme: dark) {
      .tip-warm { fill: #d9820b; }
      .tip-cool { fill: #14b8a6; }
      .note { fill: #9ca3af; }
      .cap { fill: #9ca3af; }
      .blob { fill: #24282d; stroke: #3b424b; }
      .pill-warm { fill: #3a2206; stroke: #d9820b; }
      .pill-cool { fill: #062f2c; stroke: #14b8a6; }
      .warm-t { fill: #fcd34d; }
      .cool-t { fill: #5eead4; }
      .arrow-warm { stroke: #d9820b; }
      .arrow-cool { stroke: #14b8a6; }
      .divider { stroke: #3b424b; }
    }
  </style>

  <defs>
    <marker id="tipWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="tip-warm"/>
    </marker>
    <marker id="tipCool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="tip-cool"/>
    </marker>
  </defs>

  <g class="d">
    <text class="head" x="230" y="40">A tag is a label, and labels move</text>
    <text class="head" x="650" y="40">A digest is the image itself</text>

    <line class="divider" x1="440" y1="24" x2="440" y2="288"/>

    <!-- left: tag -->
    <g>
      <rect class="pill-warm" x="150" y="70" width="160" height="42" rx="8"/>
      <text class="mono warm-t" x="230" y="96">nginx:1.27</text>

      <path class="arrow-warm" d="M 200 116 L 140 196" marker-end="url(#tipWarm)"/>
      <path class="arrow-warm" d="M 262 116 L 322 196" marker-end="url(#tipWarm)" stroke-dasharray="5 5"/>

      <text class="note" x="126" y="154">this week</text>
      <text class="note" x="340" y="154">next week</text>

      <rect class="blob" x="60" y="202" width="150" height="62" rx="6"/>
      <text class="mono" x="135" y="228">sha256:9b1d…</text>
      <text class="note" x="135" y="248">3.4 MB, built in May</text>

      <rect class="blob" x="250" y="202" width="150" height="62" rx="6"/>
      <text class="mono" x="325" y="228">sha256:4c7e…</text>
      <text class="note" x="325" y="248">3.6 MB, built in June</text>
    </g>

    <!-- right: digest -->
    <g>
      <rect class="pill-cool" x="510" y="70" width="280" height="42" rx="8"/>
      <text class="mono cool-t" x="650" y="96">nginx@sha256:9b1d…</text>

      <path class="arrow-cool" d="M 650 116 L 650 196" marker-end="url(#tipCool)"/>
      <text class="note" x="694" y="160">always</text>

      <rect class="blob" x="575" y="202" width="150" height="62" rx="6"/>
      <text class="mono" x="650" y="228">sha256:9b1d…</text>
      <text class="note" x="650" y="248">3.4 MB, built in May</text>
    </g>

    <text class="cap" x="440" y="316">Two pulls a week apart can give you different bytes from the same tag.</text>
    <text class="cap" x="440" y="338">latest is the worst offender: it is only the default tag name, not the newest build.</text>
  </g>
</svg>
