<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">docker system df output</title>
  <desc id="desc">Terminal output from docker system df, showing reclaimable space across images, containers, local volumes and build cache.</desc>

  <!-- Window -->
  <rect x="0" y="0" width="720" height="240" rx="10" fill="#1e1f22"/>
  <path d="M0 10a10 10 0 0 1 10-10h700a10 10 0 0 1 10 10v22H0z" fill="#2b2d31"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="360" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9da0a6">bash</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#d4d4d4">
    <!-- Prompt -->
    <text x="20" y="64"><tspan fill="#6ac46a">$</tspan> docker system df</text>

    <!-- Header -->
    <text y="96" fill="#9da0a6">
      <tspan x="20">TYPE</tspan><tspan x="180">TOTAL</tspan><tspan x="270">ACTIVE</tspan><tspan x="370">SIZE</tspan><tspan x="480">RECLAIMABLE</tspan>
    </text>

    <!-- Rows -->
    <text y="122">
      <tspan x="20">Images</tspan><tspan x="180">14</tspan><tspan x="270">3</tspan><tspan x="370">8.214GB</tspan><tspan x="480" fill="#e5c07b">6.931GB (84%)</tspan>
    </text>
    <text y="148">
      <tspan x="20">Containers</tspan><tspan x="180">5</tspan><tspan x="270">2</tspan><tspan x="370">1.243MB</tspan><tspan x="480" fill="#e5c07b">312.5kB (25%)</tspan>
    </text>
    <text y="174">
      <tspan x="20">Local Volumes</tspan><tspan x="180">9</tspan><tspan x="270">2</tspan><tspan x="370">2.117GB</tspan><tspan x="480" fill="#e5c07b">1.894GB (89%)</tspan>
    </text>
    <text y="200">
      <tspan x="20">Build Cache</tspan><tspan x="180">187</tspan><tspan x="270">0</tspan><tspan x="370">3.402GB</tspan><tspan x="480" fill="#e5c07b">3.402GB</tspan>
    </text>
  </g>
</svg>
