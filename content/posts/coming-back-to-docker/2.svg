<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-label="Two Dockerfile layer stacks after the same one-character source edit. Copying the source before the manifest rebuilds the pip install layer; copying the manifest first leaves it cached." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #1f2328;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12.5px;
    }
    .row { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.25; }
    .head { font-size: 15.5px; font-weight: 650; }
    .cap { font-size: 13.5px; fill: #6b7280; text-anchor: middle; }
    .pill-cool { fill: #ccfbf1; stroke: #0d9488; stroke-width: 1.25; }
    .pill-warm { fill: #fef3c7; stroke: #d97706; stroke-width: 1.25; }
    .pill-txt { font-size: 11.5px; font-weight: 650; text-anchor: middle; }
    .cool-t { fill: #115e59; }
    .warm-t { fill: #8a4f06; }
    .warm-row { fill: #fef3c7; stroke: #d97706; stroke-width: 1.75; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .row { fill: #24282d; stroke: #3b424b; }
      .cap { fill: #9ca3af; }
      .pill-cool { fill: #062f2c; stroke: #14b8a6; }
      .pill-warm { fill: #3a2206; stroke: #d9820b; }
      .cool-t { fill: #5eead4; }
      .warm-t { fill: #fcd34d; }
      .warm-row { fill: #3a2206; stroke: #d9820b; }
    }
  </style>

  <g class="d">
    <text class="head" x="30" y="40">Source copied before the manifest</text>
    <text class="head" x="450" y="40">Manifest copied before the source</text>

    <!-- left column -->
    <g>
      <rect class="row" x="30" y="66" width="400" height="44" rx="5"/>
      <text class="mono" x="44" y="93">FROM python:3.12-slim</text>
      <rect class="pill-cool" x="348" y="78" width="68" height="21" rx="10.5"/>
      <text class="pill-txt cool-t" x="382" y="93">cached</text>

      <rect class="row" x="30" y="118" width="400" height="44" rx="5"/>
      <text class="mono" x="44" y="145">WORKDIR /app</text>
      <rect class="pill-cool" x="348" y="130" width="68" height="21" rx="10.5"/>
      <text class="pill-txt cool-t" x="382" y="145">cached</text>

      <rect class="warm-row" x="30" y="170" width="400" height="44" rx="5"/>
      <text class="mono warm-t" x="44" y="197">COPY . .</text>
      <rect class="pill-warm" x="340" y="182" width="76" height="21" rx="10.5"/>
      <text class="pill-txt warm-t" x="378" y="197">rebuilt</text>

      <rect class="warm-row" x="30" y="222" width="400" height="44" rx="5"/>
      <text class="mono warm-t" x="44" y="249">RUN pip install -r requirements.txt</text>
      <rect class="pill-warm" x="340" y="234" width="76" height="21" rx="10.5"/>
      <text class="pill-txt warm-t" x="378" y="249">rebuilt</text>
    </g>

    <!-- right column -->
    <g>
      <rect class="row" x="450" y="66" width="400" height="44" rx="5"/>
      <text class="mono" x="464" y="93">FROM python:3.12-slim</text>
      <rect class="pill-cool" x="768" y="78" width="68" height="21" rx="10.5"/>
      <text class="pill-txt cool-t" x="802" y="93">cached</text>

      <rect class="row" x="450" y="118" width="400" height="44" rx="5"/>
      <text class="mono" x="464" y="145">WORKDIR /app</text>
      <rect class="pill-cool" x="768" y="130" width="68" height="21" rx="10.5"/>
      <text class="pill-txt cool-t" x="802" y="145">cached</text>

      <rect class="row" x="450" y="170" width="400" height="44" rx="5"/>
      <text class="mono" x="464" y="197">COPY requirements.txt .</text>
      <rect class="pill-cool" x="768" y="182" width="68" height="21" rx="10.5"/>
      <text class="pill-txt cool-t" x="802" y="197">cached</text>

      <rect class="row" x="450" y="222" width="400" height="44" rx="5"/>
      <text class="mono" x="464" y="249">RUN pip install -r requirements.txt</text>
      <rect class="pill-cool" x="768" y="234" width="68" height="21" rx="10.5"/>
      <text class="pill-txt cool-t" x="802" y="249">cached</text>

      <rect class="warm-row" x="450" y="274" width="400" height="44" rx="5"/>
      <text class="mono warm-t" x="464" y="301">COPY . .</text>
      <rect class="pill-warm" x="760" y="286" width="76" height="21" rx="10.5"/>
      <text class="pill-txt warm-t" x="798" y="301">rebuilt</text>
    </g>

    <text class="cap" x="440" y="360">The same one-character edit to main.py in both columns.</text>
    <text class="cap" x="440" y="382">Changing a layer invalidates every layer below it, so on the left the edit drags the whole</text>
    <text class="cap" x="440" y="402">dependency install with it. On the right that layer sits above the change and survives.</text>
  </g>
</svg>
